<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaDroid</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #e6e8ea; overflow: hidden;
    font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace;
  }
  
  :root { --strip: 0px; --cut: 0px; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas {
    
    position: absolute; inset: 0; margin: auto;
    max-width: calc(100% - var(--cut)); max-height: 100%;
    image-rendering: auto;
    transform: translateX(var(--pic-dx, 0px));
    transition: transform .22s cubic-bezier(.4, 0, .2, 1), opacity .18s linear;
  }
  
  #strip {
    position: absolute; right: 0; top: 0; bottom: 0; z-index: 25;
    width: 0; overflow: hidden;
    touch-action: pan-y;   
    background: #0b0e11; border-left: 1px solid #1c222a;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(12px * var(--ts, 1)) 0 calc(10px * var(--ts, 1)); gap: calc(10px * var(--ts, 1));
    transition: width .22s cubic-bezier(.4, 0, .2, 1), opacity .16s linear;
  }
  
  #strip.off {
    width: 0 !important; opacity: 0; pointer-events: none;
    padding-left: 0; padding-right: 0; border-width: 0;
  }
  
  body.strip-left #strip { left: 0; right: auto; border-left: none; border-right: 1px solid #1c222a; }
  body.strip-left #strip-tab {
    left: 0; right: auto; border-radius: 0 8px 8px 0;
    border-right: 1px solid #3a444e; border-left: none;
  }
  
  
  #clock { font-size: calc(16px * var(--ts, 1)); line-height: 1; color: #e6e8ea; }
  
  #phone-state {
    font-size: calc(10px * var(--ts, 1)); line-height: 1.4; color: #8b949e; text-align: center;
  }
  #ps-net { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: wrap; }
  
  #phone-sig {
    display: flex; align-items: flex-end; justify-content: center;
    gap: calc(2px * var(--ts, 1)); height: calc(9px * var(--ts, 1));
  }
  #phone-sig.off { display: none; }   
  #ps-net-t.nonet { color: #ff5252; font-weight: 700; }   
  
  svg.xi { width: 1em; height: 1em; vertical-align: -0.125em; fill: none;
    stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
  #phone-sig i { width: calc(3px * var(--ts, 1)); border-radius: 1px; background: #303841; }
  #phone-sig i.on { background: #8b949e; }
  #phone-sig i:nth-child(1) { height: calc(3px * var(--ts, 1)); }
  #phone-sig i:nth-child(2) { height: calc(5px * var(--ts, 1)); }
  #phone-sig i:nth-child(3) { height: calc(7px * var(--ts, 1)); }
  #phone-sig i:nth-child(4) { height: calc(9px * var(--ts, 1)); }

  
  #phone-state { cursor: pointer; border-radius: 8px; padding: 2px 4px; }
  #phone-state:active { background: #1a2129; }
  
  #ps-row1 { display: flex; align-items: center; justify-content: center; gap: 3px; }
  #ps-notif {
    display: none; min-width: 16px; height: 16px; padding: 0 2px;
    box-sizing: border-box; border-radius: 8px; text-align: center;
    background: #e5484d; color: #fff; font: 400 12px/16px system-ui, sans-serif;
  }
  #ps-notif.on { display: inline-block; }

  
  #npanel {
    position: fixed; z-index: 58; display: none;
    background: rgba(0,0,0,.45);
    justify-content: center; align-items: flex-start;
  }
  #npanel.on { display: flex; }
  #npanel .card {
    margin-top: 18px; width: 92%; max-width: 760px; max-height: calc(100% - 36px);
    display: flex; flex-direction: column; box-sizing: border-box;
    background: #12171d; color: #e6e8ea; border: 1px solid #262e38;
    border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    font-family: system-ui, sans-serif; overflow: hidden;
  }
  #npanel .hd {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px 20px; border-bottom: 1px solid #1f262f;
  }
  #npanel .hd .t { flex: 1; font: 700 19px system-ui, sans-serif; }
  #npanel .hd button {
    border: 0; border-radius: 18px; height: 36px; padding: 0 16px;
    background: #1d242c; color: #c9d1d9; font: 600 14px system-ui, sans-serif; cursor: pointer;
  }
  #npanel .hd .cl { width: 36px; padding: 0; font-size: 18px; }
  #npanel .list { overflow-y: auto; padding: 8px 10px 12px; }
  #npanel .sec { padding: 14px 10px 4px; font: 600 12px system-ui, sans-serif;
    color: #8b949e; text-transform: uppercase; letter-spacing: .4px; }
  #npanel .empty { padding: 26px 0 30px; text-align: center; color: #8b949e; font-size: 15px; }
  .nitem {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 10px; border-radius: 14px; cursor: pointer;
  }
  #npanel .nitem + .nitem { border-top: 1px solid #1a2028; }
  .nitem:active { background: #1a2129; }
  .nitem img { width: 36px; height: 36px; border-radius: 9px; flex: none; margin-top: 2px; }
  .nitem .nb { flex: 1; min-width: 0; }
  .nitem .nh { font-size: 12px; color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nitem .nt { font: 700 16px/1.3 system-ui, sans-serif; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nitem .nx2 { font-size: 14px; line-height: 1.35; color: #c3cad2; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere; }
  .nitem .nd {
    flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px;
    background: transparent; color: #8b949e; font-size: 17px; cursor: pointer;
  }
  .nitem .nd:active { background: #262e38; }

  
  #nbanner {
    position: fixed; z-index: 57; display: none; box-sizing: border-box;
    background: #161c23; color: #e6e8ea; border: 1px solid #2b3440;
    border-radius: 18px; box-shadow: 0 10px 32px rgba(0,0,0,.45);
    font-family: system-ui, sans-serif;
    transform: translate(-50%, -16px); opacity: 0;
    transition: transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s linear;
  }
  #nbanner.on { display: block; }
  #nbanner.in { transform: translate(-50%, 0); opacity: 1; }
  #nbanner .nitem { padding: 12px 10px 12px 14px; }
  #nbanner .nx2 { -webkit-line-clamp: 2; }
  
  body.deco #clock, body.deco #phone-state, body.deco #phone-sig { display: none; }
  
  #strip-mid {
    flex: 1 1 auto; width: 100%; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  #strip-mid::-webkit-scrollbar { display: none; }
  #strip-fav {
    display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--ts, 1));
    padding: 4px 0;
    width: 100%;
    box-sizing: border-box;
  }
  #strip-fav .app {
    flex: 0 0 auto;
    width: calc(48px * var(--ts, 1));
    max-width: calc(100% - (8px * var(--ts, 1)));
    box-sizing: border-box;
    padding: calc(4px * var(--ts, 1)) calc(2px * var(--ts, 1));
    border-radius: calc(10px * var(--ts, 1));
    margin: 0 auto;
  }
  
  #strip-fav .app img { width: calc(38px * var(--ts, 1)); height: calc(38px * var(--ts, 1)); border-radius: calc(8px * var(--ts, 1)); display: block; margin: 0 auto; }
  #strip-fav .app span { display: none; }
  #strip-fav .app.fav::after { content: none; }
  #strip-bottom { flex: 0 0 auto; }
  
  #nav #home { position: relative; }
  #nav #home .hold-mark {
    position: absolute; right: 5px; bottom: 4px; width: 7px; height: 7px;
    border: 1.5px solid currentColor; border-radius: 1px; opacity: .55;
  }
  #nav #home.hold { animation: grokHold .5s linear forwards; }
  
  #strip-tab {
    position: absolute; right: 0; top: 50%; margin-top: calc(-27px * var(--ts, 1)); z-index: 26;
    width: calc(18px * var(--ts, 1)); height: calc(54px * var(--ts, 1)); display: none;
    background: rgba(20,24,28,.75); color: #8b949e;
    border: 1px solid #3a444e; border-right: none; border-radius: calc(8px * var(--ts, 1)) 0 0 calc(8px * var(--ts, 1));
    font: calc(12px * var(--ts, 1))/calc(52px * var(--ts, 1)) ui-monospace, monospace; text-align: center; cursor: pointer;
  }
  #strip-tab.on { display: block; }
  
  #side {
    display: flex; flex-direction: column; align-items: center; gap: calc(8px * var(--ts, 1));
    width: 100%;
  }
  
  #hud {
    position: absolute; left: 8px; top: 8px; z-index: 12;
    padding: 3px 6px; background: rgba(0,0,0,.55);
    border-radius: 6px; white-space: pre; text-align: left;
    pointer-events: none;
    font-size: 9px; line-height: 1.2; opacity: .75;
  }
  #hud.hidden { display: none; }
  .ok { color: #4ade80; }
  .bad { color: #f87171; }
  .warn { color: #fbbf24; }
  #nav {
    display: flex; flex-direction: column; gap: calc(8px * var(--ts, 1));
    align-items: center;
    width: 100%;
  }
  #nav button {
    width: calc(48px * var(--ts, 1));
    max-width: calc(100% - (8px * var(--ts, 1)));
    height: calc(40px * var(--ts, 1));
    background: rgba(32,38,45,.9); color: #e6e8ea;
    border: 1px solid #2b333c; border-radius: calc(10px * var(--ts, 1));
    font: calc(18px * var(--ts, 1))/1 ui-monospace, monospace; cursor: pointer;
    opacity: .9;
    box-sizing: border-box;
    margin: 0 auto;
  }
  #nav button:active { background: rgba(70,80,92,.95); opacity: 1; }
  
  #nav button svg {
    display: block; width: calc(19px * var(--ts, 1)); height: calc(19px * var(--ts, 1));
    margin: 0 auto;
  }

  
  #apps {
    position: absolute; inset: 0; z-index: 20; display: none;
    
    background:
      linear-gradient(rgba(8,10,12,.78), rgba(8,10,12,.78)),
      url("wallpaper") center / cover no-repeat,
      #080a0c;
    padding: 10px;
  }
  
  #apps.on { display: flex; flex-direction: column; }

  #apps-body {
    flex: 1 1 auto; overflow-y: auto;
    
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  
  #apps-body.mid { display: flex; flex-direction: column; justify-content: center; }

  .sec.hide { display: none; }


  .grid {
    display: grid; gap: 10px;
    
    grid-template-columns: repeat(auto-fit, 104px);
    justify-content: center;
  }
  
  #apps-grid {
    gap: calc(10px * var(--ts, 1));
    grid-template-columns: repeat(auto-fit, calc(104px * var(--ts, 1)));
  }
  #apps-grid .app { padding: calc(10px * var(--ts, 1)) 4px; gap: calc(6px * var(--ts, 1)); }
  #apps-grid .app img { width: calc(56px * var(--ts, 1)); height: calc(56px * var(--ts, 1)); }
  #apps-grid .app span { font-size: calc(11px * var(--ts, 1)); }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px; border-radius: 12px;
    background: rgba(30,36,42,.6); border: 1px solid #2b333b;
    cursor: pointer; text-align: center; position: relative;
    
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .app:active { background: rgba(70,82,94,.9); }
  .app img { width: 56px; height: 56px; pointer-events: none; }
  .app span {
    font-size: 11px; line-height: 1.2; color: #d7dde3;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-word;
  }
  
  .app .x {
    position: absolute; top: 2px; right: 2px; z-index: 2;
    width: calc(40px * var(--ts, 1)); height: calc(40px * var(--ts, 1));
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: #3b1d20; border: 2px solid #f87171;
    color: #fecaca; font: 700 calc(20px * var(--ts, 1))/1 system-ui, sans-serif;
    cursor: pointer;
  }
  .app .x::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
  .app .x:active { background: #7f1d1d; }
  .app .x svg { width: 55%; height: 55%; stroke: #fecaca; stroke-width: 3; stroke-linecap: round; fill: none; }
  
  .app.fav::after {
    content: "★"; position: absolute; top: 4px; right: 6px;
    font-size: 11px; color: #e8c66a;
  }

  
  
  #note {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(20,24,28,.96); color: #e6e8ea;
    border: 1px solid #3a444e; border-radius: 10px;
    padding: 8px 16px; font: 13px system-ui, sans-serif;
    opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 22;
  }
  #note.on { opacity: 1; }

  
  #lost {
    position: absolute; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(8,10,12,.88); color: #ffd9d9;
    font: 17px/1.5 system-ui, sans-serif; padding: 24px;
  }
  #lost.on { display: flex; }
  #lost b { font-size: 20px; }
  #lost .dim { color: #9aa4ae; font-size: 14px; }
  
  #toast {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    z-index: 45; display: none; max-width: 80%; text-align: center;
    background: rgba(8,10,12,.9); color: #e6e8ea; border: 1px solid #2a323c;
    border-radius: 10px; padding: 12px 18px;
    font: 15px/1.4 system-ui, sans-serif;
  }
  #toast.on { display: block; }

  
  #cfreeze {
    position: fixed; inset: auto; margin: 0; z-index: 1;
    max-width: none; max-height: none; transform: none;
    pointer-events: none; display: none; opacity: 1;
    transition: opacity .22s ease-out;
  }
  #cfreeze.on { display: block; }
  #cfreeze.out { opacity: 0; }

  
  #askClose {
    position: absolute; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.38);
  }
  #askClose.on { display: flex; }
  #askClose .card {
    width: 84%; max-width: 920px; box-sizing: border-box;
    background: #fff; color: #1b1f24; border-radius: 26px;
    padding: 30px 22px 22px; text-align: center;
    font-family: system-ui, sans-serif;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }
  #askClose .t { font: 700 23px/1.25 system-ui, sans-serif; }
  #askClose .q { font: 16px/1.4 system-ui, sans-serif; color: #4a5059; margin-top: 12px; }
  #askClose .row { display: flex; gap: 12px; margin-top: 24px; }
  #askClose button {
    flex: 1; height: 46px; border: 0; border-radius: 23px;
    font: 600 16px system-ui, sans-serif; cursor: pointer;
  }
  #askClose .no { background: #eef0f3; color: #0a6fc2; }
  #askClose .yes { background: #1a9bfc; color: #fff; }

  
  #odo {
    position: absolute; z-index: 15; display: none;
    left: 12px; bottom: 12px;
    padding: 6px 10px 7px; min-width: 118px;
    background: rgba(8,10,12,.72); color: #e6e8ea;
    border: 1px solid rgba(60,70,82,.8); border-radius: 10px;
    font: 600 20px/1.15 system-ui, sans-serif; font-variant-numeric: tabular-nums;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #odo.on { display: block; }
  #odo.hold { border-color: #fbbf24; }
  #odo .l2 { font: 13px/1.3 system-ui, sans-serif; color: #9aa4ae; margin-top: 2px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #odo .t { display: inline-block; min-width: 1.1em; color: #9aa4ae; font-weight: 700; }
  #odo i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #6b7280; margin-left: 6px; vertical-align: middle; }
  #odo i.car { background: #4ade80; }
  #odo i.phone { background: #60a5fa; }

  
  #mp {
    position: absolute; z-index: 15; display: none;
    left: 12px; bottom: 84px; width: 260px;
    padding: 8px 10px 6px;
    background: rgba(8,10,12,.78); color: #e6e8ea;
    border: 1px solid rgba(60,70,82,.8); border-radius: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #mp.on { display: block; }
  #mp .t, #mp .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mp .t { font: 600 16px/1.3 system-ui, sans-serif; }
  #mp .s { font: 13px/1.3 system-ui, sans-serif; color: #9aa4ae; }
  #mp .b { display: flex; justify-content: space-around; margin-top: 4px; }
  #mp button {
    width: 64px; height: 48px; border: 0; border-radius: 10px;
    background: transparent; color: #e6e8ea; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #mp button.press { background: rgba(255,255,255,.14); }
  #mp button.off { color: #4b5563; }

  
  #ggnet {
    position: absolute; z-index: 15; display: none;
    top: 0; left: 0; right: 0;
    padding: 1px 12px; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    background: rgba(251,191,36,.09); color: rgba(251,191,36,.92);
    border-bottom: 1px solid rgba(251,191,36,.22);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    font: 600 10px/14px system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums; letter-spacing: .25px;
    pointer-events: none;
  }
  #ggnet.on { display: block; }
  #ggnet.bad {
    background: rgba(248,113,113,.10); color: rgba(252,165,165,.92);
    border-bottom-color: rgba(248,113,113,.24);
  }

  #msg {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 15px;
    
    pointer-events: none;
  }
  
  #nav #grok { display: none; }           
  body.grok-on #nav #grok { display: block; }
  body.gasst #nav #grok { color: #fff; border-color: transparent;
    background: linear-gradient(135deg, #4285f4, #9b72cb 55%, #d96570); }
  #nav #grok.wait { animation: grokWait 1s ease-in-out infinite; }
  #nav #grok.live { color: #4be37a; border-color: #2f8a4c; opacity: 1; }
  @keyframes grokWait { 50% { opacity: .3; } }
  
  #nav #grok.wake { border-color: #d9a441; box-shadow: 0 0 0 1px #d9a441 inset; opacity: 1; }
  #nav #grok.hold { animation: grokHold 3s linear forwards; }
  @keyframes grokHold { to { background: rgba(217,164,65,.45); } }

  
  #gbox {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    z-index: 44; display: none; width: auto; min-width: 280px; max-width: min(85%, 720px);
    background: rgba(8,10,12,.88); color: #e6e8ea; border: 1px solid #2a323c;
    border-radius: 14px; padding: 12px 16px;
    font: 15px/1.4 system-ui, sans-serif; pointer-events: none;
  }
  #gbox.on { display: block; }
  
  #gbox.tap { pointer-events: auto; cursor: pointer; }
  #gbox.tap.speak { border-color: #6cb4ff; }
  #gbox-head { display: flex; align-items: center; gap: 12px; }
  
  #gbox-bars { display: flex; align-items: center; gap: 4px; height: 44px; }
  #gbox-bars i { display: block; width: 6px; height: 6px; border-radius: 3px;
                 background: #4be37a; transition: height .06s linear; }
  #gbox.think #gbox-bars i { background: #e6c04b; animation: gthink 1s ease-in-out infinite; }
  #gbox.think #gbox-bars i:nth-child(2n) { animation-delay: .15s; }
  #gbox.think #gbox-bars i:nth-child(3n) { animation-delay: .3s; }
  #gbox.speak #gbox-bars i { background: #6cb4ff; }
  #gbox.wait #gbox-bars i { background: #8a939c; }
  @keyframes gthink { 50% { height: 24px; } }
  #gbox-state { font-size: 16px; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
  
  #gbox-you, #gbox-ai { margin-top: 8px; overflow: hidden; word-break: break-word; }
  #gbox-you { max-height: 2.8em; }
  #gbox-ai { max-height: 45vh; }
  #gbox-you { opacity: .6; font-size: 14px; }
  #gbox-you:empty, #gbox-ai:empty { display: none; }

  
  
  body.no-glow #gframe, #gframe.no-glow { display: none !important; }
  #gframe { --gs: 1; position: absolute; z-index: 43; pointer-events: none; display: none;
    border: 3px solid var(--gc, #8a939c); border-radius: 8px; box-sizing: border-box; }
  #gframe::after { content: ""; position: absolute; inset: 0; border-radius: 5px;
    box-shadow: inset 0 0 calc(30px * var(--gs)) calc(8px * var(--gs)) var(--gc, #8a939c); opacity: var(--gl, 0);
    transition: opacity .08s linear; }
  #gframe.on { display: block; }
  #gframe.wait  { --gc: #8a939c; animation: gfWait 1.2s ease-in-out infinite; }
  #gframe.listen, #gframe.hear { --gc: #4be37a; }
  #gframe.think { --gc: #e6c04b; animation: gfThink .55s ease-in-out infinite; }
  #gframe.speak { --gc: #6cb4ff; }
  
  #gframe.bad { --gc: #ff5252; animation: gfBad 1.5s ease-out 1; }

  var WORKLET = `
    class PcmPlayer extends AudioWorkletProcessor {
      constructor() {
        super();
        
        
        
        
        
        
        
        
        
        this.q = [];
        this.pos = 0;
        
        this.frames = 0;
        
        this.frac = 0;
        
        this.rate = 1;

        this.MAX_SLEW = 0.0025;
        
        this.SLEW_DEAD_MS = 30;
        
        this.SLEW_PER_MS = 0.00005;
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        this.MIN_MS = 60;
        this.MAX_MS = 400;
        this.TARGET_MS = 120;

        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        

        
        this.GAP_MARGIN_MS = 20;

        
        this.GAP_SANE_MS = 400;

        
        this.gapSeen = 0;
        this.GAP_DECAY = 0.985;
        
        
        this.adjTick = 0;
        this.underAtAdjust = 0;
        
        this.cleanRuns = 0;
        this.priming = true;

        
        
        
        this.underruns = 0;
        this.dropped = 0;
        this.tick = 0;

        
        
        
        
        
        
        this.XF_N = 240;          
        this.XF_DECAY = 0.985;    
        this.xf = 0; this.xfL = 0; this.xfR = 0;
        this.lastL = 0; this.lastR = 0;

        
        
        
        const onMsg = (e) => {
          if (e.data && e.data.feed) { e.data.feed.onmessage = onMsg; return; }

          
          
          if (e.data === "flush") {
            this.q = []; this.pos = 0; this.frames = 0; this.frac = 0;
            this.rate = 1; this.depthAvg = 0;
            
            
            
            this.gapSeen = 0;
            this.priming = true; this.playPts = -1; return;
          }

          
          
          if (e.data.gap !== undefined) {
            const g = e.data.gap;
            if (g <= this.GAP_SANE_MS) {
              if (g > this.gapSeen) this.gapSeen = g;
              
              
              
              
              
              if (g >= this.TARGET_MS - this.GAP_MARGIN_MS) this.cleanRuns = 0;
            }
            return;
          }

          this.q.push(e.data);
          this.frames += e.data.d.length >> 1;
          this.trim();
        };
        this.port.onmessage = onMsg;
      }

      
      startXf() {
        this.xfL = this.lastL; this.xfR = this.lastR; this.xf = this.XF_N;
      }

      
      tail(L, R, from) {
        for (let i = from; i < L.length; i++) {
          this.lastL *= this.XF_DECAY; this.lastR *= this.XF_DECAY;
          L[i] = this.lastL; if (R !== L) R[i] = this.lastR;
        }
      }

      framesQueued() { return this.frames > 0 ? this.frames : 0; }

      depthMs() { return Math.round(this.framesQueued() * 1000 / sampleRate); }

      
      trim() {
        const limit = (this.TARGET_MS + 150) * sampleRate / 1000;
        if (this.frames <= limit) return;

        const target = this.TARGET_MS * sampleRate / 1000;
        const before = this.dropped;
        while (this.q.length > 1 && this.frames > target) {
          this.frames -= (this.q[0].d.length >> 1) - this.pos;
          this.q.shift();
          this.pos = 0;
          this.dropped++;
        }
        if (this.dropped !== before) this.startXf();
      }

      
      step() {
        this.pos++;
        this.frames--;
        if (this.pos >= (this.q[0].d.length >> 1)) { this.q.shift(); this.pos = 0; }
      }

      process(inputs, outputs) {
        const out = outputs[0], L = out[0], R = out[1] || out[0];

        
        
        
        
        
        this.playPts = (!this.priming && this.q.length)
          ? this.q[0].pts + Math.round(this.pos * 1e6 / sampleRate)
          : -1;

        
        if ((++this.tick & 127) === 0) {
          this.port.postMessage({
            ms: this.depthMs(), u: this.underruns, d: this.dropped, t: this.TARGET_MS,
            
            
            
            
            p: this.playPts, c: currentTime,
            
            
            
            
            r: Math.round((this.rate - 1) * 10000)
          });

          
          
          if (++this.adjTick >= 8) {
            this.adjTick = 0;
            const fresh = this.underruns - this.underAtAdjust;
            this.underAtAdjust = this.underruns;

            
            
            
            this.gapSeen *= this.GAP_DECAY;
            const floor = Math.max(
              this.MIN_MS,
              Math.min(this.MAX_MS, Math.round(this.gapSeen) + this.GAP_MARGIN_MS)
            );

            if (fresh > 0) {
              
              
              
              
              
              
              this.TARGET_MS = Math.min(this.MAX_MS, this.TARGET_MS + 15);
              this.cleanRuns = 0;
            } else if (++this.cleanRuns >= 8) {
              
              
              
              
              this.TARGET_MS = Math.max(floor, this.TARGET_MS - 10);
              this.cleanRuns = 0;
            }

            
            
            
            
            
            
            if (this.TARGET_MS < floor) this.TARGET_MS = floor;
          }
        }

        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        this.depthAvg += (this.depthMs() - this.depthAvg) * 0.0027;

        
        
        
        let err = this.depthAvg - this.TARGET_MS;
        if (err > this.SLEW_DEAD_MS) err -= this.SLEW_DEAD_MS;
        else if (err < -this.SLEW_DEAD_MS) err += this.SLEW_DEAD_MS;
        else err = 0;

        let slew = err * this.SLEW_PER_MS;
        if (slew > this.MAX_SLEW) slew = this.MAX_SLEW;
        else if (slew < -this.MAX_SLEW) slew = -this.MAX_SLEW;
        this.rate = 1 + slew;

        
        
        
        
        
        
        if (this.priming) {
          
          
          
          if (this.depthMs() < this.TARGET_MS) {
            this.tail(L, R, 0); return true;
          }
          this.priming = false;
          this.frac = 0;
          
          this.startXf();
          
          
          
          this.depthAvg = this.depthMs();
        }

        
        
        
        
        
        
        
        
        
        
        for (let i = 0; i < L.length; i++) {
          if (this.frames < 2) {
            
            
            
            this.tail(L, R, i);
            this.priming = true;
            this.underruns++;
            break;
          }

          const c = this.q[0].d;
          const len = c.length >> 1;
          const p = this.pos;
          const a0 = c[p * 2], a1 = c[p * 2 + 1];

          let b0, b1;
          if (p + 1 < len) { b0 = c[(p + 1) * 2]; b1 = c[(p + 1) * 2 + 1]; }
          else { const n = this.q[1].d; b0 = n[0]; b1 = n[1]; }

          const f = this.frac;
          let vL = a0 + (b0 - a0) * f;

            vR = this.xfR + (vR - this.xfR) * g;
            this.xf--;
          }
          L[i] = vL; R[i] = vR;
          this.lastL = vL; this.lastR = vR;

          this.frac += this.rate;
          while (this.frac >= 1) {
            this.frac -= 1;
            this.step();
            if (!this.q.length) { this.frac = 0; break; }
          }
        }
        return true;
      }
    }
    registerProcessor('pcm-player', PcmPlayer);

    var now = grok.ctx.currentTime;
    
    
    
    
    
    
    
    
    if (grok.playAt < now) {
      var gap = grok.playAt > 0 ? now - grok.playAt : 0;
      var afterTool = grok.toolAt > 0 && now - grok.toolAt < 15;
      if (gap > 0 && gap < 6 && !grok.holding && grok.turnPlayed) {
        grok.starved++;
        
        if (!afterTool && grok.turnOpen && grok.prime < 4 && !grok.primePref) grok.prime = Math.min(4, grok.prime * 2);
        grokLog("playback underrun #" + grok.starved + ": " + Math.round(gap * 1000) + "ms silence" +
                (afterTool ? " (after tool)" : "") + "; turn buffer now " + Math.round(grok.prime * 1000) + " ms");
      }
      if (!grok.holding && grok.turnOpen && !afterTool) { grok.holding = true; grok.hold = []; grok.holdDur = 0; }
    }
    if (grok.turnOpen) grok.turnPlayed = true;
    if (grok.holding) {
      grok.hold.push({ buf: buf, peak: peak });
      grok.holdDur += buf.duration;
      if (grok.holdDur < grok.prime && grok.turnOpen) return;   
      grokRelease();
      return;
    }
    grokSchedule(buf, peak);
  }

   
  function grokRelease() {
    if (!grok.holding) return;
    grok.holding = false;
    var held = grok.hold; grok.hold = []; grok.holdDur = 0;
    if (!held.length || !grok.ctx) return;
    grok.playAt = grok.ctx.currentTime + 0.05;
    
    
    
    var left = 0;
    held.forEach(function (h) { left += h.buf.duration; });
    held.forEach(function (h) { left -= h.buf.duration; grokSchedule(h.buf, h.peak, left); });
  }

   
  function grokSchedule(buf, peak, pending) {
    var src = grok.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(grok.ctx.destination);
    var now = grok.ctx.currentTime;
    if (grok.playAt < now) grok.playAt = now + 0.05;
    
    
    
    
    
    
    var ahead = grok.playAt - now + (pending || 0);
    var rate = ahead < 0.25 ? 0.94 : ahead < 0.45 ? 0.97 : 1.0;
    if (rate !== grok.tempo) {
      grok.tempo = rate;
      grokLog("playback rate " + rate + " (margin " + Math.round(ahead * 1000) + " ms)");
    }
    src.playbackRate.value = rate;
    src.start(grok.playAt);
    var dur = buf.duration / rate;
    var entry = { src: src, at: grok.playAt, dur: dur, peak: Math.min(1, peak * 2) };
    grok.playAt += dur;
    grok.srcs.push(entry);
    src.onended = function () {
      var i = grok.srcs.indexOf(entry);
      if (i >= 0) grok.srcs.splice(i, 1);
    };
  }

  
  function grokFlush() {
    grok.srcs.forEach(function (e) { try { e.src.stop(); } catch (x) {} });
    grok.srcs = [];
    grok.playAt = 0;
    grok.tempo = 1.0;
    grok.holding = false; grok.hold = []; grok.holdDur = 0;
    grok.turnPlayed = false;
  }

  function grokOnEvent(ev) {
    
    if (ev.data instanceof Blob) {
      var ws = grok.ws;
      ev.data.text().then(function (txt) { if (grok.ws === ws) grokOnText(txt); });
      return;
    }
    if (typeof ev.data === "string") grokOnText(ev.data);
  }

  function grokOnText(data) {

    try { m = JSON.parse(data); } catch (e) { return; }

    if (grok.provider === "gemini") { grokOnGemini(m); return; }

    var t = m.type || "";
    
    
    
    if (!grok.seen[t]) { grok.seen[t] = 1; grokLog("event " + t); }
    if (t === "response.output_audio.delta" || t === "response.audio.delta") {
      grokIdleArm(); grokPlay(m.delta);
      if (grok.mode !== "speak") grokMode("speak");
      return;
    }
    if (t === "input_audio_buffer.speech_started" || t === "response.cancelled") {
      grokIdleArm(); grokFlush();
      if (t === "input_audio_buffer.speech_started") grokMode("hear");
      return;
    }
    if (t === "input_audio_buffer.speech_stopped") { grokMode("think"); return; }
    
    if (t === "response.created") {
      grokIdleArm(); grokFlush(); grok.text = ""; grokSay("gbox-ai", "");
      grokMode("think");
      return;
    }
    if (t === "response.output_audio_transcript.delta" ||
        t === "response.audio_transcript.delta") {
      grok.text += m.delta || "";
      grokSay("gbox-ai", grok.text);
      return;
    }
    
    
    if (t === "conversation.item.input_audio_transcription.updated" ||
        t === "conversation.item.input_audio_transcription.completed") {
      var tr = m.transcript || (m.item && m.item.transcript);
      if (tr) grokSay("gbox-you", "🎙 " + tr);
      return;
    }
    if (t === "error") {
      var em = (m.error && m.error.message) || JSON.stringify(m);
      grokLog("assistant error: " + em);
      showToast(gFail(em), 8000);
    }
  }

            var sinceHeard = grok.heardAt ? Date.now() - grok.heardAt : -1;
            var afterToolMs = grok.ctx && grok.toolAt > 0 ? Math.round((grok.ctx.currentTime - grok.toolAt) * 1000) : -1;
            grokLog("first audio frame: " + (sinceHeard >= 0 ? sinceHeard + "ms after transcript" : "no transcript") +
                    (afterToolMs >= 0 && afterToolMs < 15000 ? ", " + afterToolMs + "ms after tool call" : "") +

      grok.turnOpen = false; grok.turnPlayed = false; grokRelease();
      grokLog("turn ended" + (grok.ctx && grok.playAt > grok.ctx.currentTime ?
              ", queued " + Math.round((grok.playAt - grok.ctx.currentTime) * 1000) + "ms audio" : ""));
      
      
      if (grok.you) grokLog("user: \"" + grok.you.replace(/\s+/g, " ").trim().slice(0, 160) + "»");
      if (grok.text) grokLog("assistant: \"" + grok.text.replace(/\s+/g, " ").trim().slice(0, 160) + "»");

        grokBad();

      grok.text = "";
      grok.you = "";
      grok.drop = false;
      
      
      if (grok.toolInTurn && !grok.toolTurnEnded) { grok.toolTurnEnded = true; grok.toolTurnAudio = grok.turnAudio; }
      grok.holdMic = false;   
      if (grok.doneAt) grokDoneTurn(grok.turnAudio);
      grok.turnAudio = false;
      if (grok.mode === "hear" || grok.mode === "think") grokMode("listen");
    }
  }

   
  var NUDGE_SAID = /on it|opening|starting|playing|working|done|navigating/i;

  function grokNudge() {

    if (!grok.you || grok.toolInTurn || grok.nudged) return;

    grok.ws.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text:
      "(system) You said «" + said.slice(0, 80) + "» but did not call any tool. Call the matching tool now for the driver's request «" +
      grok.you.replace(/\s+/g, " ").trim().slice(0, 160) + "», silently — you have already said the word." }] }], turnComplete: true } }));

  function grokOnPhone(g) {

  function grokStop(reason, ms, quiet) {

  function toWorklet(f, pts) {
    var p = 0;
    
    for (var i = 0; i < f.length; i += 8) {
      var a = f[i] < 0 ? -f[i] : f[i];
      if (a > p) p = a;

    audio.node.port.postMessage({ d: f, pts: pts }, [f.buffer]);

  function feedAudio(u8) {
    if (!audio.on || !audio.node) return;
    
    
    
    
    if (!audio.ctx || audio.ctx.state !== "running") return;
    
    
    
    var pts = 0;
    for (var b = 1; b <= 8; b++) pts = pts * 256 + u8[b];
    audio.lastPts = pts;
    audio.lastPtsAtMs = performance.now();
    
    var n = (u8.length - 9) >> 1;
    var src = new DataView(u8.buffer, u8.byteOffset + 9, n * 2);
    var f = new Float32Array(n);
    for (var i = 0; i < n; i++) f[i] = src.getInt16(i * 2, true) / 32768;
    toWorklet(f, pts);

  function pushDecoded(data) {

      var f = new Float32Array(n), p = 0;
      for (var i = 0; i < n; i++) {
        var v = src.getInt16(i * 2, true) / 32768;
        f[i] = v;
        if ((i & 7) === 0) { var a = v < 0 ? -v : v; if (a > p) p = a; }
      }
      if (p > st.peak) st.peak = p;
      if (p > 0.02) st.loudAt = abs();
      feed.postMessage({ d: f, pts: pts }, [f.buffer]);
      st.fed++;
    }
    function connect() {
      if (closed) return;
      var s;
      try { s = new WebSocket(url); } catch (e) { postMessage({ err: String(e && e.message) }); return; }
      sock = s;
      s.binaryType = "arraybuffer";
      s.onopen = function () { retry = 0; };
      s.onmessage = function (ev) {
        if (typeof ev.data === "string") { postMessage({ text: ev.data }); return; }
        rx++;
        if (gate.paused || gate.needKey) return;
        var now = performance.now();
        if (lastRx) {
          var g = now - lastRx;
          if (g > st.gap) { st.gap = g; st.gapAt = abs(); }
          if (g > 40 && feed) feed.postMessage({ gap: g });
        }
        lastRx = now;
        var u8 = new Uint8Array(ev.data);
        if (u8[0] === 2) pcm(u8);
        else if (u8[0] === 3) postMessage({ opus: ev.data }, [ev.data]);
      };
      s.onclose = function () {
        if (sock !== s) return;
        sock = null;
        if (closed) return;
        retry = Math.min(retry + 1, 10);
        setTimeout(connect, 300 * retry);
      };
    }
    setInterval(function () {
      postMessage({ st: st, rx: rx });
      st = { gap: 0, gapAt: 0, peak: 0, loudAt: st.loudAt, fed: 0, pts: st.pts, ptsAt: st.ptsAt };
    }, 250);
    onmessage = function (e) {
      var m = e.data;
      if (m.feed) feed = m.feed;
      if (m.gate) gate = m.gate;
      if (m.url) { url = m.url; connect(); }
      if (m.close) {
        closed = true;
        if (sock) { try { sock.close(); } catch (x) {} }
        close();
      }
    };
  `;

  var audioWorker = { want: false, failed: false, active: false, rx: 0, gate: "" };

  function audioGate() {
    return {
      play: !!(audio.on && audio.node && audio.ctx && audio.ctx.state === "running"),
      paused: paused, needKey: needKey
    };
  }

  
  
  setInterval(function () {
    if (!audioWorker.active || !aws || !aws.worker) return;
    var g = audioGate(), key = JSON.stringify(g);
    if (key === audioWorker.gate) return;
    audioWorker.gate = key;
    aws.worker.postMessage({ gate: g });
  }, 100);

   
  function audioWorkerFail(why) {
    if (audioWorker.failed) return;
    audioWorker.failed = true;
    tell("snd worker thread failed (" + why + ") — audio on main thread");
    dropAudioSocket();
    connectAudio();
  }

   
  function startAudioWorker(url) {
    var w, ch;
    try {
      var src = URL.createObjectURL(new Blob([AUDIO_WORKER], { type: "application/javascript" }));
      w = new Worker(src);
      ch = new MessageChannel();
      audio.node.port.postMessage({ feed: ch.port1 }, [ch.port1]);
    } catch (e) {
      audioWorker.failed = true;
      tell("snd worker not created: " + e.message);
      return false;
    }
    var g = audioGate();
    audioWorker.gate = JSON.stringify(g);
    audioWorker.rx = 0;
    audioWorker.active = true;
    var handle = {
      worker: w,
      close: function () {
        audioWorker.active = false;
        try { w.postMessage({ close: 1 }); } catch (e) {}
        setTimeout(function () { try { w.terminate(); } catch (e) {} }, 100);
      }
    };
    aws = handle;
    w.onmessage = function (e) {
      if (aws !== handle) return;
      var m = e.data;
      if (m.text !== undefined) { audioText(m.text); return; }
      if (m.opus) { feedOpus(new Uint8Array(m.opus)); return; }
      if (m.err) { audioWorkerFail("socket: " + m.err); return; }
      if (m.st) {
        audioWorker.rx = m.rx;
        var s = m.st, o = performance.timeOrigin;
        if (s.gap > audio.gapMax) { audio.gapMax = s.gap; audio.gapAtMs = s.gapAt - o; }
        if (s.peak > audio.peak) audio.peak = s.peak;
        if (s.loudAt && s.loudAt - o > audio.loudAtMs) audio.loudAtMs = s.loudAt - o;
        audio.fed += s.fed;
        if (s.ptsAt) { audio.lastPts = s.pts; audio.lastPtsAtMs = s.ptsAt - o; }
      }
    };
    w.onerror = function (e) {
      if (aws === handle) audioWorkerFail("error: " + ((e && e.message) || "?"));
    };
    w.postMessage({ feed: ch.port2, gate: g, url: url }, [ch.port2]);
    
    setTimeout(function () {
      if (aws === handle && audioWorker.rx === 0 && !paused && ws && ws.readyState === 1) {
        audioWorkerFail("no packet for 6s");
      }
    }, 6000);
    tell("snd audio thread (Worker)");
    return true;
  }

   
  function audioText(data) {
    var m;
    try { m = JSON.parse(data); } catch (e) { return; }
    
    
    
    
    if (m.grok) { grokOnPhone(m.grok); return; }
    if (m.audio === "opus") startOpus(m.csd);
    else closeOpus();
  }

   
  function dropAudioSocket() {
    var old = aws;
    if (!old) return;
    aws = null;
    old.onopen = null;
    old.onmessage = null;
    old.onclose = null;
    old.onerror = null;
    try { old.close(); } catch (e) {}
  }

  function connectAudio() {
    dropAudioSocket();
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + location.host + location.pathname + "audio";
    
    
    if (audioWorker.want && !audioWorker.failed && audio.node && startAudioWorker(url)) return;
    var sock = new WebSocket(url);
    aws = sock;
    sock.binaryType = "arraybuffer";

    sock.onmessage = function (ev) {
      if (typeof ev.data === "string") { audioText(ev.data); return; }
      var raw = new Uint8Array(ev.data);
      
      
      if (paused || needKey) return;
      
      
      
      var rxNow = performance.now();
      if (audio.lastRxMs) {
        var gap = rxNow - audio.lastRxMs;
        if (gap > audio.gapMax) { audio.gapMax = gap; audio.gapAtMs = rxNow; }
        
        
        
        
        
        
        
        if (gap > 40 && audio.node) audio.node.port.postMessage({ gap: gap });
      }
      audio.lastRxMs = rxNow;
      if (raw[0] === 2) feedAudio(raw);
      else if (raw[0] === 3) feedOpus(raw);
    };

    sock.onopen = function () { awsRetry = 0; };
    sock.onclose = function () {
      
      if (aws !== sock) return;
      aws = null;
      awsRetry = Math.min(awsRetry + 1, 10);
      setTimeout(connectAudio, 300 * awsRetry);
    };
    sock.onerror = function () {   };
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    
    
    ws = new WebSocket(proto + "//" + location.host + location.pathname + "stream");
    if (!aws) connectAudio();
    ws.binaryType = "arraybuffer";

    ws.onopen = function () {
      retry = 0;
      wsState = T.haveLink;
      msg.textContent = T.waitKey;
      renderHud(wsState);
      
      
      if (window.tmSendStrip) window.tmSendStrip();
      
      
      
      
      
      lastSent = "";
      sendSize();
      declareOpus();
      warmIcons();
      wakeDeclare();   
      
      
      
      
      if (!aws) connectAudio();
    };

    ws.onmessage = function (ev) {
      if (typeof ev.data === "string") {
        var next;
        try { next = JSON.parse(ev.data); } catch (e) { return; }

        
        
        
        
        
        if (next && next.launched) { closeAfterLaunch(); return; }
        if (next && next.closed) { closedState(next.closed); return; }

        
        if (next && next.menu) { autoOpened = false; openMenu("apps"); return; }

        
        
        
        if (next && next.drm) { showToast(T.drmAudioOnly, 8000); return; }

        
        
        if (next && next.askclose) { askClose(next.askclose); return; }

        
        
        if (next && next.notifs) { notifsSet(next.notifs); return; }
        if (next && next.npop) { notifBanner(next.npop); return; }

        
        
        
        if (next && next.shellrestricted) { showToast(T.shellRestricted, 20000); return; }

        
        if (next && next.micprobe) { if (window.tmMicProbe) window.tmMicProbe(); return; }

        
        
        if (next && next.grok) { grokOnPhone(next.grok); return; }

        
        
        
        
        
        
        if (next && next.audio) {
          if (next.audio === "opus") startOpus(next.csd);
          else closeOpus();
          return;
        }

        
        
        
        if (next && typeof next.lost === "number") {
          showLost(next.lost ? (next.why || T.linkLost) : null);
          return;
        }

        if (next && next.odo) { odoState(next.odo); return; }
        if (next && next.gpsguard) { gpsGuardState(next.gpsguard); return; }
        if (next && next.nosat) { noSatState(next.nosat); return; }
        if (next && next.media) { mediaState(next.media); return; }

        if (next && next.phone) {
          if (window.tmPhoneState) window.tmPhoneState(next.phone);
          return;
        }

        if (next && typeof next.home === "number") {
          displayEmpty = next.home === 1;
          if (next.home) {
            if (!appsBox.classList.contains("on")) {
              autoOpened = true;
              openMenu("apps");
            }
          } else if (autoOpened) {
            autoOpened = false;
            appsBox.classList.remove("on");
            if (window.tmApplyStrip) window.tmApplyStrip();
          }
          return;
        }

        
        
        
        
        
        if (next && next.build && BUILD !== "__BUILD__" && String(next.build) !== BUILD) {
          var mark = "tesladroid-reloaded-for";
          var done = null;
          try { done = sessionStorage.getItem(mark); } catch (e) {}
          if (done !== String(next.build)) {
            try { sessionStorage.setItem(mark, String(next.build)); } catch (e) {}
            tell("gk page build " + BUILD + ", app " + next.build + " — reloading");
            setTimeout(function () { location.reload(); }, 300);
            return;
          }
        }

        
        
        if (typeof next.vdelay === "number") {
          var nd = Math.max(0, Math.min(600, next.vdelay | 0));
          if (nd !== manualDelayMs) {
            manualDelayMs = nd;
            
            
            vqFlush();
          }
        }

        if (!next || !next.w || !next.h) return;
        
        next.codec = next.codec || "hevc";

        
        
        
        
        
        
        
        
        if (window.tmSetLayout) window.tmSetLayout(next.strip, next.deco);
        
        
        
        var wantW = next.aw === 1;
        if (wantW !== audioWorker.want) {
          audioWorker.want = wantW;
          audioWorker.failed = false;
          if (aws) { dropAudioSocket(); connectAudio(); }
        }
        
        
        
        if (decoder && next.w === meta.w && next.h === meta.h &&
            next.codec === meta.codec && (next.cut || 0) === (meta.cut || 0)) return;
        meta = next;

        
        
        
        
        resizeCanvasTo(next.w, next.h);

        
        
        if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
        waitingKey = true;

        pickCodec(function (c, accel) {
          if (!c) {
            
            
            
            
            
            
            
            if (meta.codec !== "avc" && !avcAsked && ws && ws.readyState === 1) {
              avcAsked = true;
              wsState = T.hevcAsking;
              msg.innerHTML = T.hevcAskingMsg;
              ws.send("nohevc");
              
              
              avcTimer = setTimeout(function () {
                fail(T.hevcNoAnswer);
              }, 6000);
              return;
            }
            fail(fmt(T.codecUnsupported, meta.codec === "avc" ? "H.264" : "H.265"));
            return;
          }
          if (avcTimer) { clearTimeout(avcTimer); avcTimer = null; }
          codecUsed = c + "|" + accel;
          try {
            decoder = makeDecoder(c, accel);
            wsState = fmt(T.decoderReady, meta.w + "×" + meta.h);
          } catch (e) {
            fail(fmt(T.configureFailed, e.message));
          }
        });
        return;
      }

      var raw = new Uint8Array(ev.data);
      
      
      
      
      
      if (raw[0] === 2) { if (!paused && !needKey) feedAudio(raw); return; }
      
      
      
      if (raw[0] === 3) { if (!paused && !needKey) feedOpus(raw); return; }

      if (!decoder || decoder.state !== "configured") return;

      var buf = raw;
      stats.rx++;
      stats.rxBytes += buf.length;
      lastArrivalMs = performance.now();

      var isKey = buf[0] === 1;
      if (paused) return;
      if (needKey) {
        if (!isKey) return;
        needKey = false;
      }
      if (waitingKey) {
        if (!isKey) return;      
        waitingKey = false;
      }

      var pts = 0;
      for (var i = 1; i <= 8; i++) pts = pts * 256 + buf[i];

      
      
      
      var body = manualDelayMs < 8 ? buf.subarray(9) : buf.slice(9);
      feedVideo(new EncodedVideoChunk({
        type: isKey ? "key" : "delta",
        timestamp: pts,
        data: body
      }), isKey);
    };

    ws.onclose = function () {
      wsState = T.wsLost;
      renderHud(wsState);
      waitingKey = true;
      vqDrop();
      if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
      
      
      
      
      
      dropAudioSocket();
      retry = Math.min(retry + 1, 10);
      setTimeout(connect, 300 * retry);
    };

    ws.onerror = function () {   };
  }

  
  
  
  (function initInput() {
    
    
    var active = new Map();   
    var pendingMove = null;   

    function norm(e) {
      var r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      return {
        x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
        y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
      };
    }

    function serialize() {
      var out = [];
      active.forEach(function (p, id) {
        out.push(id + ":" + p.x.toFixed(4) + ":" + p.y.toFixed(4));
      });
      return out.join(";");
    }

    function send(kind, id) {
      if (!ws || ws.readyState !== 1) return;
      if (active.size === 0) return;
      ws.send(kind + "," + id + "," + serialize());
      stats.input++;
      
      syncYield();
    }

    var sawPointerEvent = false;

    canvas.addEventListener("pointerdown", function (e) {
      var p = norm(e); if (!p) return;
      sawPointerEvent = true;
      active.set(e.pointerId, p);
      send("d", e.pointerId);
      
      
      
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    canvas.addEventListener("pointermove", function (e) {
      if (!active.has(e.pointerId)) return;
      var p = norm(e); if (!p) return;
      active.set(e.pointerId, p);
      pendingMove = e.pointerId;   
      e.preventDefault();
    });

    function flushPending() {
      if (pendingMove !== null) { send("m", pendingMove); pendingMove = null; }
    }

    function tick() {
      flushPending();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function up(e) {
      if (!active.has(e.pointerId)) return;
      
      
      flushPending();
      send("u", e.pointerId);      
      active.delete(e.pointerId);
      e.preventDefault();
    }

    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);

    
    
    
    
    function touchHandler(kind) {
      return function (te) {
        if (sawPointerEvent) return;
        var i, t, p;
        if (kind === "u") {
          for (i = 0; i < te.changedTouches.length; i++) {
            t = te.changedTouches[i];
            if (!active.has(t.identifier)) continue;
            send("u", t.identifier);
            active.delete(t.identifier);
          }
        } else {
          for (i = 0; i < te.changedTouches.length; i++) {
            t = te.changedTouches[i];
            p = norm(t);
            if (!p) continue;
            active.set(t.identifier, p);
            send(kind, t.identifier);
          }
        }
        te.preventDefault();
      };
    }

    canvas.addEventListener("touchstart", touchHandler("d"), { passive: false });
    canvas.addEventListener("touchmove", touchHandler("m"), { passive: false });
    canvas.addEventListener("touchend", touchHandler("u"), { passive: false });
    canvas.addEventListener("touchcancel", touchHandler("u"), { passive: false });

    
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    canvas.style.touchAction = "none";
  })();

  connect();
})();
